<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta  name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link href="styles.css" rel="stylesheet" >
</head>
<body>
    <section id = "Contenedor-Padre">
        <section class = "Barra-Izq">
            <h2 >📝 Mis Tareas</h2>
            <hr>
            <div class="Columnas-Tareas">
                <ul class="Estado-Tareas">
                    <li>✔️Todas </li>
                    <li>🕐 Pendientes </li>
                    <li> ✅Completadas </li>
                    <li> 📌Importantes </li>
                </ul>
                <div class="Columna-Numeros">
                    <span>#
                    </span>
                    <span>#
                    </span>
                    <span>#
                    </span>
                    <span>#
                    </span>
                </div>
            </div>
            <hr>
            <div>
                <h3 >Etiquetas</h3>
                    <div class="Columnas-Tareas">
                    <ul class="Etiquetas">
                        <li>🔵 Trabajo</li>
                        <li>🟢Estudio</li>
                        <li>🟣Personal</li>
                        <li>🟠Salud</li>
                    </ul>
                <div class="Columna-Numeros">
                    <span>#
                    </span>
                    <span>#
                    </span>
                    <span>#
                    </span>
                    <span>#
                    </span>
                </div>
                    </div>
            </div>
            <div id="Barra-Progreso">
                <span>📊</span>
                <h3>Progreso general</h3>
                <div id="Barra-Entera">
                    <div id="Barra-Completada">
                    </div>
                </div>
                <h4 id="Contador-Tareas-Completadas"></h4>
            </div>
        </section>
        <section class="Barra-Der">
            <div id="Encabezado">
                <h1>Todas las Tareas</h1>
                <input id="Buscador-Tareas" placeholder="Buscar Tarea...">
                <div class ="Botones-Encabezado">
                    <button id="Modo-Claro">☀️</button>
                    <button id="Modo-Oscuro">🌙</button>
                    
                </div>
            </div>
            <main>
                <div id="Barra-agregar-Tareas">
                    <input id="Input-Tarea" placeholder="¿Qué tarea quieres agregar?">
                    <div id="Agregar-Tarea-Der">
                        <div class="select-container">
                            <select id="Tipo-Btn">
                                <option value="Tipo" selected>Seleccione tipo de tarea</option>
                                <option value="Trabajo">Trabajo</option>
                                <option value="Salud">Salud</option>
                                <option value="Personal">Personal</option>
                                <option value="Estudio">Estudio</option>
                        </select>
                        </div>
                        <button id="Fecha-Btn">📅 Fecha</button>
                        <select id="Prioridad-Btn">
                            <option value="Prioridad" selected>⚡️Prioridad</option>
                            <option value="Alta">Alta</option>
                            <option value="Media">Media</option>
                            <option value="Baja">Baja</option>
                        </select> 
                        <button id="Agregar-Tarea-Btn">➕Agregar</button>
                    </div>
                </div>
                <div id="Filtros">
                    <div id="Filtros-Izq">
                    <button id="Filtro-Todas">Todas</button>
                    <button id="Filtro-Pendientes">Pendientes</button>
                    <button id="Filtro-Completadas">Completadas</button>
                    </div>
                    <div id="Filtros-Der">
                        <select id="Ordenamiento-Tareas"  >
                            <option value="" selected> Ordenar por: </option>
                            <option value="Fecha-Limite">Fecha Límite</option>
                            <option value="Prioridad">Prioridad</option>
                            <option value="Favoritos">Favoritos</option>
                        </select>
                    </div>
                </div>
                <div id="Contenedor-Tareas">
                    <ul id="Lista-Tareas">
                    </ul>
                
                </div>
        </main>
        <div id="Contador-tareas">
            
        </div>
    </section>
</section>
    <script src="script.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
<script src="script.js"></script>
</body>
</html>
